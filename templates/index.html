<!DOCTYPE html>
<html>
<head>
    <title>AI Summarizer</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="container">

<h1>📝 AI Text Summarizer</h1>

<form method="POST">

<textarea name="text"
placeholder="Enter a long paragraph..."
required></textarea>

<button type="submit">Summarize</button>

</form>

{% if summary %}
<h2>Summary</h2>
<p>{{ summary }}</p>
{% endif %}

</div>

</body>
</html>
